---
# Substituted into every app by cluster-apps
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER: mc
  STORAGECLASS: openebs-hostpath
  STORAGECLASS_LOCAL: openebs-hostpath
  STORAGECLASS_SHARED: none
  SNAPSHOTCLASS: none
  BACKUP_BUCKET: mc-ops
  BACKUP_COPYMETHOD: Direct
