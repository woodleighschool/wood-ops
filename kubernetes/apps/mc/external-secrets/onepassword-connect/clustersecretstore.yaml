---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
# The 1Password vaults this cluster reads. The lowest number wins when an item
# exists in more than one.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local
      vaults:
        KubernetesMC: 1
        Kubernetes: 2
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-vault-secret
            namespace: external-secrets
            key: OP_CONNECT_TOKEN
