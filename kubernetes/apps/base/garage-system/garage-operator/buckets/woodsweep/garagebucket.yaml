---
# yaml-language-server: $schema=https://raw.githubusercontent.com/rajsinghtech/garage-operator/refs/heads/main/schemas/garagebucket_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: woodsweep
spec:
  # The existing bucket and its contents; the operator never creates a new one
  # while this is set.
  bucketId: db6c8302c64b40ee9d5076c00d727ebeeb5027a9d54d0cc93bea2c6ac747d17d
  clusterRef:
    name: garage
  # Deleting this leaves the bucket in Garage: the operator won't delete one that
  # still holds objects. They go with the cluster's volumes.
  deletionPolicy: Retain
  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html
