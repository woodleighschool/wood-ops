---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prtgmpprobe
spec:
  chartRef:
    kind: OCIRepository
    name: prtgmpprobe
  interval: 1h
  values:
    controllers:
      prtgmpprobe:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/paessler/multi-platform-probe
              tag: v3.10.0@sha256:78ffc8d67593de749817ff6fb16b6236e4844ea5694e37c08cc15aacac9800e2
            command: ["/opt/paessler/mpprobe/prtgmpprobe"]
            env:
              TZ: Australia/Melbourne
              HOME: /tmp
              PRTGMPPROBE__MOMO__DIR: /opt/paessler/mpprobe/monitoringmodules
              PRTGMPPROBE__ID: ${PROBE_ID}
              PRTGMPPROBE__NAME: ${CLUSTER}
              PRTGMPPROBE__NATS__URL: tls://prtg.woodleighschool.net:23561
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # Ping sensors open raw sockets, which need root with these capabilities.
              capabilities: { drop: ["ALL"], add: ["NET_ADMIN", "NET_RAW"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
    persistence:
      tmp:
        type: emptyDir
