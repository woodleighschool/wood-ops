---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prtgmpprobe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prtgmpprobe-secret
    template:
      data:
        PRTGMPPROBE__ACCESS_KEY: "{{ .ACCESS_KEY }}"
        PRTGMPPROBE__NATS__AUTHENTICATION__USER: "{{ .NATS_USER }}"
        PRTGMPPROBE__NATS__AUTHENTICATION__PASSWORD: "{{ .NATS_PASSWORD }}"
  dataFrom:
    - extract:
        key: prtgmpprobe
