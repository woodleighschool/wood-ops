---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodstar
spec:
  chartRef:
    kind: OCIRepository
    name: woodstar
  interval: 1h
  values:
    controllers:
      woodstar:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/woodleighschool/woodstar
              tag: 0.12.0@sha256:3e135792b8f91ab9a3b01862e2d8f6872822d465fdbbb92136cd1ff66b5dd1a4
            env:
              TZ: Australia/Melbourne
              WOODSTAR_ENTRA_TRANSITIVE_GROUPS: true
              WOODSTAR_HTTP_CLIENT_IP_SOURCE: xff_trusted_cidrs
              WOODSTAR_HTTP_CLIENT_IP_TRUSTED_CIDRS: 10.42.0.0/16
              WOODSTAR_ORBIT_SCRIPT_EXECUTION_TIMEOUT: 10m
              WOODSTAR_STORAGE_KIND: s3
              WOODSTAR_STORAGE_S3_BUCKET: woodstar
              WOODSTAR_STORAGE_S3_ENDPOINT: https://67ccf561cd3d68abc81838e145a046b8.r2.cloudflarestorage.com
              WOODSTAR_STORAGE_S3_PATH_STYLE: "true"
              WOODSTAR_STORAGE_S3_REGION: auto
              WOODSTAR_URL: "https://{{ .Release.Name }}.woodleigh.vic.edu.au"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.woodleigh.vic.edu.au"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      tmp:
        type: emptyDir
