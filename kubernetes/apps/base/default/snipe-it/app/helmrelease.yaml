---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snipe-it
spec:
  chartRef:
    kind: OCIRepository
    name: snipe-it
  interval: 1h
  values:
    controllers:
      snipe-it:
        containers:
          app:
            image:
              repository: docker.io/snipe/snipe-it
              tag: v8.8.4-alpine@sha256:12e15e9502e56182a2829fa9e1b51ed66f51071525f5276da280ba85c15df96f
            env:
              ALLOW_BACKUP_DELETE: "false"
              ALLOW_DATA_PURGE: "true"
              ALLOW_IFRAMING: "false"
              API_THROTTLE_PER_MINUTE: "1000"
              APP_ENV: production
              APP_TIMEZONE: Australia/Melbourne
              APP_TRUSTED_PROXIES: 10.42.0.0/16,10.10.69.0/24
              APP_PORT: &port 80
              APP_URL: https://snipe-it.woodleighschool.net
              MAX_RESULTS: "1000"
              PRIVATE_FILESYSTEM_DISK: local
              PUBLIC_FILESYSTEM_DISK: local_public
              REFERRER_POLICY: same-origin
              SECURE_COOKIES: "false"
              # Mail
              MAIL_AUTO_EMBED_METHOD: "attachment"
              MAIL_FROM_ADDR: you@example.com
              MAIL_FROM_NAME: "Snipe-IT"
              MAIL_HOST: mailhog
              MAIL_MAILER: smtp
              MAIL_PASSWORD: "null"
              MAIL_PORT: 1025
              MAIL_REPLYTO_ADDR: you@example.com
              MAIL_REPLYTO_NAME: "Snipe-IT"
              MAIL_TLS_VERIFY_PEER: "true"
              MAIL_USERNAME: "null"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: &host snipe-it.woodleighschool.net
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              #readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /var/lib/snipeit
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /run/apache2
            subPath: run
          - path: /var/www/html/bootstrap/cache
            subPath: bootstrap-cache
          - path: /var/www/html/storage/app/backup-temp
            subPath: backup-temp
          - path: /var/www/html/storage/app/restore-temp
            subPath: restore-temp
          - path: /var/www/html/storage/fonts
            subPath: fonts
          - path: /var/www/html/storage/framework/cache
            subPath: framework-cache
          - path: /var/www/html/storage/framework/sessions
            subPath: framework-sessions
          - path: /var/www/html/storage/framework/views
            subPath: framework-views
          - path: /var/www/html/storage/livewire-tmp
            subPath: livewire-tmp
          - path: /var/www/html/storage/logs
            subPath: logs
          - path: /var/www/logs/
            subPath: www-logs
