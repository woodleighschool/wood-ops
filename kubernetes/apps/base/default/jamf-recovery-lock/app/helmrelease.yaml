---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jamf-recovery-lock
spec:
  chartRef:
    kind: OCIRepository
    name: jamf-recovery-lock
  interval: 1h
  values:
    controllers:
      jamf-recovery-lock:
        type: cronjob
        cronjob:
          schedule: "@daily"
          backoffLimit: 0
          timeZone: "Australia/Melbourne"
        containers:
          app:
            image:
              repository: ghcr.io/woodleighschool/jamf-recovery-lock
              tag: 3.1.2@sha256:02b880a1c389a73f13b9db7b9c59093b6dbcfae7c4d930a734a6de917ec14ab7
            env:
              PASSWORD_LENGTH: 10
              LOG_LEVEL: debug
              INSTANCE_DOMAIN: wdm.jamfcloud.com
              TZ: Australia/Melbourne
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      tmp:
        type: emptyDir
