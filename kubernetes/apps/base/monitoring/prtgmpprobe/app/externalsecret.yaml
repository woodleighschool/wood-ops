---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prtgmpprobe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prtgmpprobe-secret
    template:
      data:
        PROBE_ID: "{{ .PROBE_ID }}"
        PROBE_NAME: "{{ .PROBE_NAME }}"
  dataFrom:
    - extract:
        key: prtgmpprobe
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prtgmpprobe-cfg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prtgmpprobe-cfg
    manifest:
      apiVersion: v1
      kind: ConfigMap
    template:
      data:
        config.yaml: |
          access_key: {{ .ACCESS_KEY }}
          nats:
            url: tls://{{ .PRTG_HOST }}
            authentication:
              user: {{ .NATS_USER }}
              password: {{ .NATS_PASSWORD }}
            server_ca: /config/sunca_root.crt
  dataFrom:
    - extract:
        key: prtgmpprobe
