---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prtgmpprobe
spec:
  chartRef:
    kind: OCIRepository
    name: prtgmpprobe
  interval: 1h
  values:
    controllers:
      prtgmpprobe:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hydazz/prtgmpprobe
              tag: 3.11.0@sha256:e146bc512ea2be2fd91043252c98ca3188541455eaa820e5c0137496eef8bf27
            env:
              TZ: Australia/Melbourne
              PRTGMPPROBE__NATS__SERVER_CA: /etc/paessler/mpprobe/certs/sunca.pem
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # Ping sensors open raw sockets, which need root with these capabilities.
              capabilities: { drop: ["ALL"], add: ["NET_ADMIN", "NET_RAW"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
    persistence:
      sunca:
        type: configMap
        name: sunca
        globalMounts:
          - path: /etc/paessler/mpprobe/certs
      tmp:
        type: emptyDir
