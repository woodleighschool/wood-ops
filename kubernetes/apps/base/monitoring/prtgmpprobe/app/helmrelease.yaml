---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prtgmpprobe
spec:
  chartRef:
    kind: OCIRepository
    name: prtgmpprobe
  interval: 1h
  values:
    controllers:
      prtgmpprobe:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/PaesslerAG/docker-multi-platform-probe
              tag: v3.11.0@sha256:ec575061909ccbd2281b8f624a0f1cdbbbc095442eda76739f3f960655b5af09
            env:
              TZ: Australia/Melbourne
              PRTGMPPROBE__ID: "{{ .PROBE_ID }}"
              PRTGMPPROBE__NAME: "{{ .PROBE_NAME }}"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { add: ["NET_ADMIN", "NET_RAW"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      config:
        data:
          config.yaml: |-
            access_key: ${ACCESS_KEY}
            nats:
              url: tls://${PRTG_HOST}
              authentication:
                user: ${NATS_USER}
                password: ${NATS_PASSWORD}
              server_ca: /config/sunca_root.crt
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /opt/prtg/config.yaml
            subPath: config.yaml
