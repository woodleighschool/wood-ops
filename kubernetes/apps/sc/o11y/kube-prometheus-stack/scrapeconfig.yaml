---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: assetcache
spec:
  staticConfigs:
    - targets:
        - 10.1.110.46:9200
      labels:
        instance: SC-MACCACHE
    - targets:
        - 10.2.0.25:9200
      labels:
        instance: PC-MACCACHE
    - targets:
        - 10.3.110.9:9200
      labels:
        instance: MC-MACCACHE
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: assetcache
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: remote-prometheus
spec:
  staticConfigs:
    - targets:
        - 10.20.69.90:9090
      labels:
        cluster: pc
    - targets:
        - 10.30.69.90:9090
      labels:
        cluster: mc
  # SC's own Prometheus job, so the chart's Prometheus alerts (TargetDown,
  # PrometheusErrorSendingAlertsToAnyAlertmanager, ...) also cover pc and mc
  relabelings:
    - action: replace
      targetLabel: job
      replacement: kube-prometheus-stack-prometheus
    - action: replace
      targetLabel: namespace
      replacement: o11y
