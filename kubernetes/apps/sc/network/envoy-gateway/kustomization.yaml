---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  # SC's gateways: which exist, their LoadBalancer addresses and certificates
  - ./gateways.yaml
patches:
  - patch: |-
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyProxy
      metadata:
        name: envoy
      spec:
        provider:
          kubernetes:
            envoyDeployment:
              replicas: 2
