---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# SC issues these and renews them every few days, so keep pulling instead of
# importing once.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: _
      spec:
        refreshPolicy: Periodic
    target:
      kind: ExternalSecret
