---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prtgmpprobe
spec:
  interval: 1h
  path: ./kubernetes/apps/base/o11y/prtgmpprobe/app
  postBuild:
    substitute:
      PROBE_ID: df4d6409-356b-4045-ba63-88e31a07114e
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: o11y
