[tasks.apply-node]
description = "Apply Talos config to a node"
extends = "node"
usage = '''
arg "<node>" help="Node to apply the config to"
arg "[args]" var=#true help="Extra arguments for talosctl apply-config"
'''
confirm = { message = "Apply Talos config to {{ usage.node }} in {{ exec(command='mise run //:cluster') }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
cluster="$(mise run //:cluster)"
addr="$(mise run //talos:address "$cluster" "$usage_node")"
config="$(mise run //talos:render-config "$usage_node")"
printf '%s\n' "$config" | talosctl --context "$cluster" -e "$addr" -n "$addr" apply-config -f /dev/stdin "${args[@]}"
'''

[tasks.download-image]
description = "Download Talos machine image"
extends = "node"
usage = '''
arg "<version>" help="Talos version"
arg "[node]" help="Node whose schematic to use, instead of the cluster's"
'''
run = '''
cluster="$(mise run //:cluster)"
schematic="$(mise run //talos:schematic-id "$cluster" "${usage_node:-}")"
curl -fL --remove-on-error --retry 5 --retry-delay 5 --retry-all-errors --progress-bar \
    -o "talos-${usage_version}-${schematic:0:8}.iso" \
    "https://factory.talos.dev/image/${schematic}/${usage_version}/metal-amd64.iso"
mise run //:log info "Downloaded Talos" version "$usage_version" schematic "$schematic"
'''

[tasks.reboot-node]
description = "Reboot a node"
extends = "node"
usage = 'arg "<node>" help="Node to reboot"'
confirm = { message = "Reboot node {{ usage.node }} in {{ exec(command='mise run //:cluster') }}?", default = "no" }
run = '''
cluster="$(mise run //:cluster)"
addr="$(mise run //talos:address "$cluster" "$usage_node")"
talosctl --context "$cluster" -e "$addr" -n "$addr" reboot -m powercycle
'''

[tasks.render-config]
description = "Render Talos config for a node"
extends = "node"
usage = 'arg "<node>" help="Node to render the config for"'
run = '''
cluster="$(mise run //:cluster)"
schematic="$(mise run //talos:schematic-id "$cluster" "$usage_node")"
role="controlplane"
if [[ -f "${cluster}/nodes/workers/${usage_node}.yaml.j2" ]]; then
    role="workers"
fi
machine="$(mise run //:template machine.yaml.j2 -D "schematic=${schematic}")"
cluster_patch="$(mise run //:template "${cluster}/cluster.yaml.j2")"
role_patch="$(mise run //:template "${role}.yaml.j2")"
cluster_role_patch="$(mise run //:template "${cluster}/${role}.yaml.j2")"
node_patch="$(mise run //:template "${cluster}/nodes/${role}/${usage_node}.yaml.j2")"
talosctl machineconfig patch <(printf '%s\n' "$machine") \
    -p @<(printf '%s\n' "$cluster_patch") \
    -p @<(printf '%s\n' "$role_patch") \
    -p @<(printf '%s\n' "$cluster_role_patch") \
    -p @<(printf '%s\n' "$node_patch") |
    yq 'with(select(.kind == "ResolverConfig"); .searchDomains.domains = [])'
'''

[tasks.reset-node]
description = "Reset a node"
extends = "node"
usage = '''
arg "<node>" help="Node to reset"
arg "[args]" var=#true help="Extra arguments for talosctl reset"
'''
confirm = { message = "Reset node {{ usage.node }} in {{ exec(command='mise run //:cluster') }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
cluster="$(mise run //:cluster)"
addr="$(mise run //talos:address "$cluster" "$usage_node")"
talosctl --context "$cluster" -e "$addr" -n "$addr" reset --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --system-labels-to-wipe u-local-hostpath --graceful=false "${args[@]}"
'''

[tasks.shutdown-node]
description = "Shutdown a node"
extends = "node"
usage = '''
arg "<node>" help="Node to shut down"
arg "[args]" var=#true help="Extra arguments for talosctl shutdown"
'''
confirm = { message = "Shutdown node {{ usage.node }} in {{ exec(command='mise run //:cluster') }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
cluster="$(mise run //:cluster)"
addr="$(mise run //talos:address "$cluster" "$usage_node")"
talosctl --context "$cluster" -e "$addr" -n "$addr" shutdown "${args[@]}"
'''

[tasks.upgrade-k8s]
description = "Upgrade Kubernetes version on the cluster"
usage = 'arg "<version>" help="Kubernetes version"'
confirm = { message = "Upgrade Kubernetes on {{ exec(command='mise run //:cluster') }} to {{ usage.version }}?", default = "no" }
run = '''
cluster="$(mise run //:cluster)"
node="$(mise run //talos:nodes "$cluster" | sed -n 1p)"
addr="$(mise run //talos:address "$cluster" "$node")"
talosctl --context "$cluster" -e "$addr" -n "$addr" upgrade-k8s --to "$usage_version"
'''

[tasks.upgrade-node]
description = "Upgrade Talos version on a node"
extends = "node"
usage = '''
arg "<node>" help="Node to upgrade"
arg "[args]" var=#true help="Extra arguments for talosctl upgrade"
'''
confirm = { message = "Upgrade node {{ usage.node }} in {{ exec(command='mise run //:cluster') }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
cluster="$(mise run //:cluster)"
addr="$(mise run //talos:address "$cluster" "$usage_node")"
image="$(mise run //talos:machine-image "$cluster" "$usage_node")"
talosctl --context "$cluster" -e "$addr" -n "$addr" upgrade -i "$image" -m powercycle --timeout=10m "${args[@]}"
'''

[tasks.address]
hide = true
usage = '''
arg "<cluster>"
arg "<node>"
'''
run = '''
yq -r -e 'select(.addresses) | .addresses[0].address | sub("/.*", "")' "${usage_cluster}"/nodes/*/"${usage_node}".yaml.j2
'''

[tasks.nodes]
hide = true
usage = 'arg "<cluster>"'
run = '''
for f in "${usage_cluster}"/nodes/{controlplane,workers}/*.yaml.j2; do
    if [[ -f "$f" && "$f" != *.schematic.yaml.j2 ]]; then
        basename "$f" .yaml.j2
    fi
done
'''

# Most specific wins: node, then cluster, then the shared default.
[tasks.schematic-file]
hide = true
usage = '''
arg "<cluster>"
arg "[node]"
'''
run = '''
file="schematic.yaml.j2"
if [[ -f "${usage_cluster}/schematic.yaml.j2" ]]; then
    file="${usage_cluster}/schematic.yaml.j2"
fi
if [[ -n "${usage_node:-}" ]]; then
    for f in "${usage_cluster}"/nodes/*/"${usage_node}".schematic.yaml.j2; do
        if [[ -f "$f" ]]; then
            file="$f"
        fi
    done
fi
echo "$file"
'''

[tasks.schematic-id]
hide = true
usage = '''
arg "<cluster>"
arg "[node]"
'''
run = '''
file="$(mise run //talos:schematic-file "$usage_cluster" "${usage_node:-}")"
schematic="$(mise run //:template "$file")"
printf '%s\n' "$schematic" | curl -fsSX POST --data-binary @- "https://factory.talos.dev/schematics" | jq -er '.id'
'''

[tasks.machine-image]
hide = true
usage = '''
arg "<cluster>"
arg "[node]"
'''
run = '''
schematic="$(mise run //talos:schematic-id "$usage_cluster" "${usage_node:-}")"
mise run //:template machine.yaml.j2 -D "schematic=${schematic}" | yq -r -e 'select(.kind == "UnattendedInstallConfig") | .installer.image'
'''
